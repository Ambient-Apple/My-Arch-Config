animations {
    enabled = yes
    #Bezier curves
    bezier = snappy, 0.04, 0.9, 0.1, 3
    bezier = myBezier, 0.05, 0.9, 0.1, 1.05

    #animation = [NAME], [ON/OFF], [SPEED], [CURVE], [STYLE]
    animation = windows, 1, 2, snappy
    animation = windowsIn, 1, 6, myBezier, popin 50%
    animation = windowsOut, 1, 7, myBezier, slide
    animation = windowsMove, 1, 4, myBezier, popin 85%

    animation = layers, 1, 2, snappy, popin 80%
    animation = layersIn, 1, 4, myBezier, popin 80%

    animation = workspaces, 1, 6, myBezier, slide
}
